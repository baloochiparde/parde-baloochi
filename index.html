<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>پرده بلوچی</title>

<style>
body{
font-family:tahoma;
direction:rtl;
text-align:center;
padding:30px;
}

select,input,button{
padding:12px;
margin:10px;
width:80%;
font-size:16px;
}

button{
background:#222;
color:white;
border:0;
}

#result{
margin-top:20px;
font-size:20px;
font-weight:bold;
}
</style>

</head>

<body>

<h1>پرده بلوچی</h1>

<h3>ماشین حساب قیمت دوخت پرده</h3>

<select id="model">
<option value="100">پرده ساده</option>
<option value="120">پرده پلیسه</option>
<option value="140">پرده مینیمال</option>
<option value="150">پرده پانچ</option>
</select>

<br>

<input id="meter" type="number" placeholder="متراژ پرده">

<br>

<button onclick="calculate()">محاسبه</button>

<div id="result"></div>


<script>

function calculate(){

let price=document.getElementById("model").value;
let meter=document.getElementById("meter").value;

let total=price*meter*1000;

document.getElementById("result").innerHTML=
"هزینه دوخت: "+total.toLocaleString()+" تومان";

}

</script>

</body>
</html>
